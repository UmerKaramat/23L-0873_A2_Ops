<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classification Result — VisionGuard</title>
    <style>
        :root {
            --primary: #2563eb;
            --ai-color: #dc2626;
            --ai-bg: #fef2f2;
            --real-color: #16a34a;
            --real-bg: #f0fdf4;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #ffffff;
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand { font-size: 1.25rem; font-weight: 700; color: var(--primary); }
        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 1.5rem;
            font-weight: 500;
        }
        .nav-links a:hover { color: var(--primary); }
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2.5rem;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            text-align: center;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        .file-info { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.5rem; word-break: break-all; }
        .result-box {
            padding: 1.5rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            border: 2px solid;
        }
        .result-ai {
            background: var(--ai-bg);
            border-color: #fca5a5;
            color: var(--ai-color);
        }
        .result-real {
            background: var(--real-bg);
            border-color: #86efac;
            color: var(--real-color);
        }
        .label-text { font-size: 1.75rem; font-weight: 800; letter-spacing: 0.02em; margin-bottom: 0.5rem; }
        .confidence-text { font-size: 1.1rem; font-weight: 600; }
        .progress-container {
            width: 100%;
            background-color: #e2e8f0;
            border-radius: 9999px;
            height: 10px;
            margin: 1rem 0 0.5rem 0;
            overflow: hidden;
        }
        .progress-bar-ai { background-color: var(--ai-color); height: 100%; }
        .progress-bar-real { background-color: var(--real-color); height: 100%; }
        .btn {
            display: inline-block;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 0.85rem 1.75rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn:hover { background: #1d4ed8; }
        footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">VisionGuard</div>
        <nav class="nav-links">
            <a href="/">Upload</a>
            <a href="/history">History</a>
            <a href="/health" target="_blank">Health</a>
        </nav>
    </header>

    <main>
        <div class="card">
            <h1>Classification Result</h1>
            <p class="file-info">Image: <strong>{{ filename }}</strong></p>

            <div class="result-box {% if label == 'AI-Generated' %}result-ai{% else %}result-real{% endif %}">
                <div class="label-text">{{ label }}</div>
                <div class="confidence-text">Confidence: {{ "%.2f"|format(confidence) }}%</div>

                <div class="progress-container">
                    <div class="{% if label == 'AI-Generated' %}progress-bar-ai{% else %}progress-bar-real{% endif %}"
                         style="width: {{ confidence }}%;"></div>
                </div>
            </div>

            <a href="/" class="btn">Classify Another Image</a>
        </div>
    </main>

    <footer>
        VisionGuard &middot; MLOps Assignment 2 &middot; In-Memory Inference
    </footer>
</body>
</html>
